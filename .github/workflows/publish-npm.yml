# Publishes to npm when you push a tag like v0.4.0 (after bumping package.json).
#
# Authentication is npm Trusted Publishing (OIDC) — there is no NPM_TOKEN.
# GitHub Actions proves its identity to npm directly, so nothing secret is
# stored in this repo, nothing expires, and there is no 2FA prompt to answer.
#
# One-time setup on npmjs.com:
#   npmjs.com/package/agent-vcr → Settings → Trusted Publisher → GitHub Actions
#     Organization or user: ajayvnkt
#     Repository:           agent-vcr
#     Workflow filename:    publish-npm.yml
#     Environment:          (leave blank)
#
# Requirements (both satisfied below): npm CLI >= 11.5.1, Node >= 22.14.0.

name: Publish npm

on:
  push:
    tags:
      - 'v*' # e.g. v0.4.0 — must match package.json version (checked below)
  workflow_dispatch: # Actions → Publish npm → Run workflow (publishes package.json version on chosen branch)

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required: lets the runner mint the OIDC token npm verifies
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
          cache-dependency-path: package-lock.json

      # Node 22 ships npm 10.x; trusted publishing needs 11.5.1 or later.
      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@latest
          npm --version
          node --version

      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG must match package.json version $PKG"
            exit 1
          fi

      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

      # No NODE_AUTH_TOKEN: the OIDC identity above is the credential.
      - run: npm publish --access public
