name: Action self-test

# Runs the repository's own GitHub Action (action.yml) the way a user would,
# once on a passing suite and once on a suite that must fail.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  passing-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - id: check
        uses: ./
        with:
          suite: examples/check-suite/suite.json
          artifact-name: selftest-passing
      - name: Verdict must be pass, and the report must exist
        env:
          VERDICT: ${{ steps.check.outputs.verdict }}
          HAS_REPORT: ${{ steps.check.outputs.has-report }}
          REPORT_DIR: ${{ steps.check.outputs.report-dir }}
        run: |
          test "$VERDICT" = "pass"
          test "$HAS_REPORT" = "true"
          test -s "$REPORT_DIR/report.html"
      # Proves the upload step really ran: the download fails if no artifact was uploaded.
      - uses: actions/download-artifact@v4
        with:
          name: selftest-passing
          path: downloaded-report
      - run: test -s downloaded-report/results.json

  failing-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - id: check
        uses: ./
        continue-on-error: true
        with:
          suite: examples/check-suite/suite.failing.json
          artifact-name: selftest-failing
      - name: The action must have failed, with verdict fail
        env:
          OUTCOME: ${{ steps.check.outcome }}
          VERDICT: ${{ steps.check.outputs.verdict }}
        run: |
          test "$OUTCOME" = "failure"
          test "$VERDICT" = "fail"

  missing-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - id: check
        uses: ./
        continue-on-error: true
        with:
          suite: examples/check-suite/does-not-exist.json
          artifact-name: ''
      - name: An unreadable suite must fail, never pass
        env:
          OUTCOME: ${{ steps.check.outcome }}
          VERDICT: ${{ steps.check.outputs.verdict }}
        run: |
          test "$OUTCOME" = "failure"
          test "$VERDICT" = "fail"
