name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

      # Validate all golden traces
      - name: Validate golden traces
        run: |
          for f in examples/*/traces/*.expected.json; do
            node dist/cli.js validate "$f"
          done

      # Run all examples
      - run: npm run example:all

  python-client:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: npm ci --include=dev
      - run: npm run build
      - run: python -m pip install ./python
      - run: python -m unittest discover -s python/tests -v
